<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 420" width="1136" height="420" role="img" aria-label="도메인이 내 앱에 연결되기까지 — 등록기관, 네임서버, DNS 레코드, SSL/TLS 인증서 4단계 파이프라인과 Vercel 네임서버 위임 / 외부 DNS 유지 두 방식 비교">
  <style>
    text { font-family: 'Noto Sans KR', sans-serif; fill: #0F172A; }
    .m { font-family: 'JetBrains Mono', monospace; }
    .mut { fill: #57564F; }
    .dim { fill: #8A8880; }
    .ac  { fill: #0F766E; }
    .ac2 { fill: #115E59; }
    .warn { fill: #B45309; }
    .bx { fill: #FAF9F5; stroke: #D8D5CC; stroke-width: 1; }
    .band { fill: #F2F0EA; }
  </style>

  <rect x="0" y="0" width="1136" height="420" fill="#FAF9F5"/>

  <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L8 4 L0 8 Z" fill="#57564F"/>
  </marker>

  <text x="16" y="26" font-size="18" font-weight="700">도메인이 내 앱에 연결되기까지 — 등록기관 · 네임서버 · DNS · SSL</text>

  <!-- ============ 4단계 파이프라인 ============ -->
  <line x1="234" y1="103" x2="254" y2="103" stroke="#57564F" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="478" y1="103" x2="498" y2="103" stroke="#57564F" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="848" y1="103" x2="868" y2="103" stroke="#57564F" stroke-width="1" marker-end="url(#ar)"/>

  <!-- 1 등록기관 -->
  <rect class="bx" x="16" y="44" width="214" height="118" rx="4"/>
  <circle cx="208" cy="66" r="11" fill="#0F766E"/>
  <text x="208" y="70.5" font-size="13" font-weight="700" fill="#FAF9F5" text-anchor="middle">1</text>
  <text x="30" y="71" font-size="15" font-weight="600">도메인 등록기관</text>
  <text class="m mut" x="30" y="90" font-size="13">(Registrar)</text>
  <text class="ac" x="30" y="114" font-size="13">“이름의 소유권”</text>
  <text class="mut" x="30" y="135" font-size="13">예: 가비아, 후이즈,</text>
  <text class="mut" x="30" y="151" font-size="13">Cloudflare Registrar</text>

  <!-- 2 네임서버 -->
  <rect class="bx" x="260" y="44" width="214" height="118" rx="4"/>
  <circle cx="452" cy="66" r="11" fill="#0F766E"/>
  <text x="452" y="70.5" font-size="13" font-weight="700" fill="#FAF9F5" text-anchor="middle">2</text>
  <text x="274" y="71" font-size="15" font-weight="600">네임서버</text>
  <text class="m mut" x="274" y="90" font-size="13">(NS, Name Server)</text>
  <text x="274" y="114" font-size="13">이 도메인의 DNS 레코드를</text>
  <text x="274" y="131" font-size="13">누가 관리하는가</text>
  <text class="dim" x="274" y="153" font-size="13">등록기관 화면에서 지정</text>

  <!-- 3 DNS 레코드 -->
  <rect class="bx" x="504" y="44" width="340" height="118" rx="4"/>
  <circle cx="822" cy="66" r="11" fill="#0F766E"/>
  <text x="822" y="70.5" font-size="13" font-weight="700" fill="#FAF9F5" text-anchor="middle">3</text>
  <text x="518" y="71" font-size="15" font-weight="600">DNS 레코드</text>
  <text class="m mut" x="518" y="90" font-size="13">(Domain Name System)</text>
  <text class="m ac2" x="518" y="114" font-size="13" font-weight="700">A</text>
  <text x="574" y="114" font-size="13">IPv4 주소를 직접 지정</text>
  <text class="m ac2" x="518" y="132" font-size="13" font-weight="700">CNAME</text>
  <text x="574" y="132" font-size="13">다른 이름으로 위임 (Canonical Name)</text>
  <text class="m ac2" x="518" y="150" font-size="13" font-weight="700">TXT</text>
  <text x="574" y="150" font-size="13">소유 증명 · 정책 (Text Record)</text>

  <!-- 4 SSL/TLS -->
  <rect class="bx" x="874" y="44" width="244" height="118" rx="4"/>
  <circle cx="1096" cy="66" r="11" fill="#0F766E"/>
  <text x="1096" y="70.5" font-size="13" font-weight="700" fill="#FAF9F5" text-anchor="middle">4</text>
  <text x="888" y="71" font-size="15" font-weight="600">SSL/TLS 인증서</text>
  <text class="m mut" x="888" y="90" font-size="13">Secure Sockets Layer /</text>
  <text class="m mut" x="888" y="106" font-size="13">Transport Layer Security</text>
  <text x="888" y="130" font-size="13">Vercel이 ACME 챌린지로</text>
  <text x="888" y="147" font-size="13">검증 후 자동 발급</text>

  <!-- ============ 연결 2방식 ============ -->
  <text x="16" y="184" font-size="14" font-weight="600">연결 2방식 — 어느 쪽이든 결과는 같다</text>
  <text class="dim" x="1120" y="184" font-size="13" text-anchor="end">등록기관에서 NS를 바꾸느냐, 외부 DNS에 레코드를 넣느냐의 차이</text>

  <!-- 트랙 A -->
  <rect class="band" x="17" y="193" width="542" height="31"/>
  <rect class="bx" x="16" y="192" width="544" height="192" rx="4"/>
  <line x1="16" y1="224.5" x2="560" y2="224.5" stroke="#D8D5CC" stroke-width="1"/>
  <text class="ac" x="30" y="214" font-size="15" font-weight="600">방식 A — Vercel 네임서버 위임</text>
  <text class="mut" x="546" y="214" font-size="13" text-anchor="end">레코드 관리를 Vercel에 위임</text>

  <circle cx="38" cy="241.5" r="10" fill="#0F766E"/>
  <text x="38" y="246" font-size="13" font-weight="700" fill="#FAF9F5" text-anchor="middle">1</text>
  <text x="56" y="246" font-size="13">등록기관(가비아 등)에서 네임서버를 아래 두 값으로 교체</text>

  <rect x="56" y="256" width="340" height="28" rx="4" fill="#F2F0EA" stroke="#D8D5CC" stroke-width="1"/>
  <text class="m ac2" x="70" y="274" font-size="13">ns1.vercel-dns.com</text>
  <text class="m ac2" x="238" y="274" font-size="13">ns2.vercel-dns.com</text>

  <circle cx="38" cy="301.5" r="10" fill="#0F766E"/>
  <text x="38" y="306" font-size="13" font-weight="700" fill="#FAF9F5" text-anchor="middle">2</text>
  <text x="56" y="306" font-size="13">DNS 레코드(A · CNAME)는 Vercel이 자동 생성 · 관리</text>

  <text class="dim" x="30" y="330" font-size="13">와일드카드(*.example.com)는 이 방식으로만 검증된다</text>
  <text class="warn" x="30" y="354" font-size="13">주의 — 네임서버를 옮기면 기존 MX(Mail Exchange, 메일) 레코드가 사라진다.</text>
  <text class="warn" x="30" y="372" font-size="13">Vercel DNS에 전부 다시 등록해야 메일이 죽지 않는다.</text>

  <!-- 트랙 B -->
  <rect class="band" x="577" y="193" width="542" height="31"/>
  <rect class="bx" x="576" y="192" width="544" height="192" rx="4"/>
  <line x1="576" y1="224.5" x2="1120" y2="224.5" stroke="#D8D5CC" stroke-width="1"/>
  <text class="ac" x="590" y="214" font-size="15" font-weight="600">방식 B — 외부 DNS 유지 (Cloudflare · 가비아)</text>
  <text class="mut" x="1106" y="214" font-size="13" text-anchor="end">레코드를 직접 관리</text>

  <circle cx="598" cy="241.5" r="10" fill="#0F766E"/>
  <text x="598" y="246" font-size="13" font-weight="700" fill="#FAF9F5" text-anchor="middle">1</text>
  <text x="616" y="246" font-size="13">등록기관 · Cloudflare DNS에 레코드를 직접 추가</text>

  <rect x="616" y="254" width="470" height="54" rx="4" fill="#F2F0EA" stroke="#D8D5CC" stroke-width="1"/>
  <text class="m" x="630" y="274" font-size="13">example.com</text>
  <text class="m ac2" x="760" y="274" font-size="13" font-weight="700">A</text>
  <text class="mut" x="810" y="274" font-size="13">프로젝트 고유 IP 주소</text>
  <text class="m" x="630" y="297" font-size="13">www.example.com</text>
  <text class="m ac2" x="760" y="297" font-size="13" font-weight="700">CNAME</text>
  <text class="mut" x="810" y="297" font-size="13">프로젝트 고유 호스트</text>

  <circle cx="598" cy="325.5" r="10" fill="#0F766E"/>
  <text x="598" y="330" font-size="13" font-weight="700" fill="#FAF9F5" text-anchor="middle">2</text>
  <text x="616" y="330" font-size="13">값은 프로젝트마다 다르다 — <tspan class="m ac2">vercel domains inspect</tspan></text>

  <text class="warn" x="590" y="354" font-size="13">주의 — “general-purpose value”라 불리는 고정 IP를 외우지 말 것.</text>
  <text class="warn" x="590" y="372" font-size="13">apex(example.com 자체) A 레코드는 정확히 하나만 남긴다 — 여러 개면 흔들린다.</text>

  <text class="dim" x="16" y="406" font-size="12">DNS 전파는 TTL(Time To Live, 레코드 캐시 유효시간)만큼 지연된다 — 최대 48시간. ACME(Automatic Certificate Management Environment) = 인증서 자동 발급 프로토콜.</text>
</svg>
