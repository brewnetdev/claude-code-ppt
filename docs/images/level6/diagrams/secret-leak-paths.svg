<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 485" width="1136" height="485" role="img" aria-label="시크릿이 새는 네 가지 경로와 각 경로의 방어선">
<style>
text{font-family:'Noto Sans KR',sans-serif;fill:#0F172A}
.m{font-family:'JetBrains Mono',monospace}
.ti{font-size:20px;font-weight:700}
.h{font-size:14px;fill:#8A8880}
.t1{font-size:17px;fill:#0F172A}
.t2{font-size:15px;fill:#57564F}
.d1{font-size:15px;fill:#0F172A}
.num{font-size:15px;fill:#57564F}
.fn{font-size:12px;fill:#57564F}
.bx{fill:#FAF9F5;stroke:#D8D5CC;stroke-width:1}
.src{fill:#FAF9F5;stroke:#0F766E;stroke-width:1.5}
.def{fill:#F2F0EA;stroke:#D8D5CC;stroke-width:1}
.ln{stroke:#57564F;stroke-width:1;fill:none}
</style>
<defs>
<marker id="ag" viewBox="0 0 9 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0.6 L9 4 L0 7.4 Z" fill="#57564F"/></marker>
<marker id="at" viewBox="0 0 9 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0.6 L9 4 L0 7.4 Z" fill="#0F766E"/></marker>
</defs>
<rect width="1136" height="485" fill="#FAF9F5"/>

<text class="ti" x="14" y="27">시크릿이 새는 네 가지 경로 — 그리고 각각의 방어선</text>
<text class="h" x="14" y="52">시크릿 원본</text>
<text class="h" x="256" y="52">유출 경로</text>
<text class="h" x="712" y="52">방어선</text>

<!-- source -->
<rect class="src" x="14" y="121" width="212" height="236" rx="4"/>
<text class="m" x="26" y="163" font-size="17" fill="#115E59">.env.local</text>
<line x1="26" y1="178" x2="214" y2="178" stroke="#D8D5CC" stroke-width="1"/>
<text class="m" x="26" y="205" font-size="15">POSTGRES_URL</text>
<text class="m" x="26" y="229" font-size="15">DATABASE_URL</text>
<text class="t2" x="26" y="255">API 키 · 액세스 토큰</text>
<text class="t2" x="26" y="293">한 번 새면 이 값 자체가</text>
<text class="t2" x="26" y="315">공격자의 자격 증명이 된다</text>

<!-- fan spine -->
<line class="ln" x1="226" y1="239" x2="239" y2="239"/>
<line class="ln" x1="239" y1="101" x2="239" y2="377"/>
<line class="ln" x1="239" y1="101" x2="249" y2="101" marker-end="url(#ag)"/>
<line class="ln" x1="239" y1="193" x2="249" y2="193" marker-end="url(#ag)"/>
<line class="ln" x1="239" y1="285" x2="249" y2="285" marker-end="url(#ag)"/>
<line class="ln" x1="239" y1="377" x2="249" y2="377" marker-end="url(#ag)"/>

<!-- 1 -->
<rect class="bx" x="256" y="62" width="424" height="78" rx="4"/>
<circle cx="278" cy="90" r="12" fill="#F2F0EA" stroke="#57564F" stroke-width="1"/>
<text class="num" x="278" y="95" text-anchor="middle">1</text>
<text class="t1" x="302" y="95">Git 커밋</text>
<text class="d1" x="302" y="124"><tspan class="m">.env</tspan> 를 실수로 <tspan class="m">git add</tspan> → 원격 저장소에 영구 기록</text>
<line class="ln" x1="684" y1="101" x2="708" y2="101" marker-end="url(#at)"/>
<rect class="def" x="712" y="62" width="408" height="78" rx="4"/>
<text class="d1" x="726" y="95"><tspan class="m">.gitignore</tspan> + <tspan class="m">gitleaks</tspan> pre-commit 훅</text>
<text class="t2" x="726" y="124">GitHub Push Protection — 푸시 자체를 차단</text>

<!-- 2 -->
<rect class="bx" x="256" y="154" width="424" height="78" rx="4"/>
<circle cx="278" cy="182" r="12" fill="#F2F0EA" stroke="#57564F" stroke-width="1"/>
<text class="num" x="278" y="187" text-anchor="middle">2</text>
<text class="t1" x="302" y="187">클라이언트 번들</text>
<text class="d1" x="302" y="216"><tspan class="m">NEXT_PUBLIC_</tspan> 접두사 → 빌드 시 번들에 인라인</text>
<line class="ln" x1="684" y1="193" x2="708" y2="193" marker-end="url(#at)"/>
<rect class="def" x="712" y="154" width="408" height="78" rx="4"/>
<text class="d1" x="726" y="187">서버 전용 값에는 <tspan class="m">NEXT_PUBLIC_</tspan> 금지</text>
<text class="t2" x="726" y="216">브라우저에 보여도 되는 값에만 접두사를 붙인다</text>

<!-- 3 -->
<rect class="bx" x="256" y="246" width="424" height="78" rx="4"/>
<circle cx="278" cy="274" r="12" fill="#F2F0EA" stroke="#57564F" stroke-width="1"/>
<text class="num" x="278" y="279" text-anchor="middle">3</text>
<text class="t1" x="302" y="279">로그 · 에러 메시지</text>
<text class="d1" x="302" y="308">연결 문자열이 스택트레이스·빌드 로그에 그대로 출력</text>
<line class="ln" x1="684" y1="285" x2="708" y2="285" marker-end="url(#at)"/>
<rect class="def" x="712" y="246" width="408" height="78" rx="4"/>
<text class="d1" x="726" y="279">Vercel 빌드 로그 자동 마스킹 <tspan class="m">[REDACTED]</tspan></text>
<text class="t2" x="726" y="308">앱 로깅에서도 연결 문자열을 직접 가린다</text>

<!-- 4 -->
<rect class="bx" x="256" y="338" width="424" height="78" rx="4"/>
<circle cx="278" cy="366" r="12" fill="#F2F0EA" stroke="#57564F" stroke-width="1"/>
<text class="num" x="278" y="371" text-anchor="middle">4</text>
<text class="t1" x="302" y="371">공유 · 스크린샷</text>
<text class="d1" x="302" y="400">캡처·문서·채팅 붙여넣기로 값이 그대로 노출</text>
<line class="ln" x1="684" y1="377" x2="708" y2="377" marker-end="url(#at)"/>
<rect class="def" x="712" y="338" width="408" height="78" rx="4"/>
<text class="d1" x="726" y="371">Vercel <tspan class="m">Sensitive</tspan> 플래그 — 저장 후 값 재조회 불가</text>
<text class="t2" x="726" y="400">정기 로테이션(rotate)으로 수명 자체를 줄인다</text>

<text class="fn" x="14" y="452">유출된 값은 지우는 게 아니라 회전(rotate)한다 — 커밋을 되돌려도 Git 히스토리·포크·로그·캐시에 원래 값이 영구히 남는다.</text>
</svg>
