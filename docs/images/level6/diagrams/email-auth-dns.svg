<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 430" width="1136" height="430" role="img" aria-label="인증 메일이 스팸함으로 가지 않으려면 — SPF, DKIM, DMARC 3단계 검사와 Resend 도메인 인증 DNS 레코드 4개">
  <style>
    text { font-family: 'Noto Sans KR', sans-serif; fill: #0F172A; }
    .m { font-family: 'JetBrains Mono', monospace; }
    .sub { fill: #57564F; }
    .dim { fill: #8A8880; }
    .ac { fill: #0F766E; }
    .n { fill: #FAF9F5; font-size: 13px; font-weight: 700; text-anchor: middle; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#57564F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1136" height="430" fill="#FAF9F5"/>

  <!-- title -->
  <text x="8" y="24" font-size="18" font-weight="700">인증 메일이 스팸함으로 가지 않으려면 — SPF · DKIM · DMARC</text>

  <!-- column captions -->
  <text x="240" y="44" font-size="13" class="sub">수신 메일 서버의 3단계 인증 검사</text>
  <text x="858" y="44" font-size="13" class="sub">판정 결과</text>

  <!-- sender -->
  <rect x="8" y="126" width="210" height="68" fill="#F2F0EA" stroke="#D8D5CC" stroke-width="1" rx="4"/>
  <text x="20" y="148" font-size="15" font-weight="700">markflow 앱</text>
  <text x="20" y="168" font-size="13" class="sub">Resend 로 인증 메일 발송</text>
  <text x="20" y="186" font-size="13" class="ac">발신 <tspan class="m">send.</tspan> 서브도메인</text>
  <line x1="218" y1="160" x2="240" y2="160" stroke="#57564F" stroke-width="1" marker-end="url(#a)"/>

  <!-- check group -->
  <rect x="240" y="52" width="580" height="216" fill="#F2F0EA" stroke="#D8D5CC" stroke-width="1" rx="4"/>

  <!-- check 1 : SPF -->
  <rect x="250" y="60" width="560" height="60" fill="#FAF9F5" stroke="#D8D5CC" stroke-width="1" rx="4"/>
  <circle cx="270" cy="75" r="9" fill="#0F766E"/>
  <text x="270" y="80" class="n">1</text>
  <text x="288" y="80" font-size="15"><tspan font-weight="700" class="ac">SPF</tspan><tspan font-size="13" class="sub"> (Sender Policy Framework · 발신자 정책 프레임워크)</tspan></text>
  <text x="288" y="98" font-size="13">“이 도메인 이름으로 메일을 보낼 자격이 있는 서버인가”를 증명</text>
  <text x="288" y="114" font-size="13" class="sub">DNS <tspan class="m">TXT</tspan> 레코드 · 이름 <tspan class="m">send</tspan></text>

  <!-- check 2 : DKIM -->
  <rect x="250" y="130" width="560" height="60" fill="#FAF9F5" stroke="#D8D5CC" stroke-width="1" rx="4"/>
  <circle cx="270" cy="145" r="9" fill="#0F766E"/>
  <text x="270" y="150" class="n">2</text>
  <text x="288" y="150" font-size="15"><tspan font-weight="700" class="ac">DKIM</tspan><tspan font-size="13" class="sub"> (DomainKeys Identified Mail · 도메인키 식별 메일)</tspan></text>
  <text x="288" y="168" font-size="13">“본문·헤더가 중간에 변조되지 않았는가”를 증명</text>
  <text x="288" y="184" font-size="13" class="sub">개인키로 서명 · 공개키는 DNS <tspan class="m">TXT</tspan> · 이름 <tspan class="m">resend._domainkey</tspan></text>

  <!-- check 3 : DMARC -->
  <rect x="250" y="200" width="560" height="60" fill="#FAF9F5" stroke="#D8D5CC" stroke-width="1" rx="4"/>
  <circle cx="270" cy="215" r="9" fill="#0F766E"/>
  <text x="270" y="220" class="n">3</text>
  <text x="288" y="220" font-size="15"><tspan font-weight="700" class="ac">DMARC</tspan><tspan font-size="13" class="sub"> (Domain-based Message Authentication, Reporting &amp; Conformance)</tspan></text>
  <text x="288" y="238" font-size="13">“SPF·DKIM 이 실패하면 어떻게 처리할지”를 도메인 소유자가 지시</text>
  <text x="288" y="254" font-size="13" class="sub"><tspan class="m">_dmarc</tspan> <tspan class="m">TXT</tspan> · 정책 <tspan class="m">p=none → quarantine → reject</tspan> 순으로 강화</text>

  <!-- branch -->
  <line x1="820" y1="160" x2="838" y2="160" stroke="#57564F" stroke-width="1"/>
  <line x1="838" y1="124" x2="838" y2="196" stroke="#57564F" stroke-width="1"/>
  <line x1="838" y1="124" x2="858" y2="124" stroke="#57564F" stroke-width="1" marker-end="url(#a)"/>
  <line x1="838" y1="196" x2="858" y2="196" stroke="#57564F" stroke-width="1" marker-end="url(#a)"/>

  <rect x="858" y="96" width="270" height="56" fill="#F2F0EA" stroke="#D8D5CC" stroke-width="1" rx="4"/>
  <text x="872" y="120" font-size="15" font-weight="700">받은편지함 (Inbox)</text>
  <text x="872" y="140" font-size="13" class="sub">SPF · DKIM · DMARC 모두 통과</text>

  <rect x="858" y="168" width="270" height="56" fill="#F2F0EA" stroke="#D8D5CC" stroke-width="1" rx="4"/>
  <text x="872" y="192" font-size="15" font-weight="700">스팸함 · 차단</text>
  <text x="872" y="212" font-size="13" class="sub">인증 실패 → <tspan class="m">p=</tspan> 정책대로 처리</text>

  <!-- DNS record table -->
  <text x="8" y="282" font-size="13" class="sub">Resend 도메인 인증 — DNS 레코드 4개 (값은 Resend 대시보드에서 지급)</text>

  <rect x="8" y="288" width="1120" height="21" fill="#F2F0EA" stroke="#D8D5CC" stroke-width="1"/>
  <rect x="8" y="309" width="1120" height="84" fill="none" stroke="#D8D5CC" stroke-width="1"/>
  <line x1="8" y1="330" x2="1128" y2="330" stroke="#D8D5CC" stroke-width="1"/>
  <line x1="8" y1="351" x2="1128" y2="351" stroke="#D8D5CC" stroke-width="1"/>
  <line x1="8" y1="372" x2="1128" y2="372" stroke="#D8D5CC" stroke-width="1"/>
  <line x1="118" y1="288" x2="118" y2="393" stroke="#D8D5CC" stroke-width="1"/>
  <line x1="390" y1="288" x2="390" y2="393" stroke="#D8D5CC" stroke-width="1"/>
  <line x1="700" y1="288" x2="700" y2="393" stroke="#D8D5CC" stroke-width="1"/>

  <text x="20" y="303" font-size="13" font-weight="700">타입</text>
  <text x="130" y="303" font-size="13" font-weight="700">이름 (호스트)</text>
  <text x="402" y="303" font-size="13" font-weight="700">값</text>
  <text x="712" y="303" font-size="13" font-weight="700">역할</text>

  <text x="20" y="324" font-size="13" class="m">MX</text>
  <text x="130" y="324" font-size="13" class="m">send</text>
  <text x="402" y="324" font-size="13" class="sub"><tspan class="m">&lt;지급값&gt;</tspan> · 우선순위 <tspan class="m">10</tspan></text>
  <text x="712" y="324" font-size="13" class="sub">반송 · 불만 피드백 수신</text>

  <text x="20" y="345" font-size="13" class="m">TXT</text>
  <text x="130" y="345" font-size="13" class="m">send</text>
  <text x="402" y="345" font-size="13" class="sub m">&lt;지급값&gt;</text>
  <text x="712" y="345" font-size="13" class="sub"><tspan class="ac" font-weight="700">SPF</tspan> — 발신 서버 자격 공표</text>

  <text x="20" y="366" font-size="13" class="m">TXT</text>
  <text x="130" y="366" font-size="13" class="m">resend._domainkey</text>
  <text x="402" y="366" font-size="13" class="sub m">&lt;지급값&gt;</text>
  <text x="712" y="366" font-size="13" class="sub"><tspan class="ac" font-weight="700">DKIM</tspan> — 서명 검증용 공개키</text>

  <text x="20" y="387" font-size="13" class="m">TXT</text>
  <text x="130" y="387" font-size="13" class="m">_dmarc</text>
  <text x="402" y="387" font-size="13" class="sub m">&lt;지급값&gt;</text>
  <text x="712" y="387" font-size="13" class="sub"><tspan class="ac" font-weight="700">DMARC</tspan> — 실패 시 처리 정책</text>

  <!-- footnote -->
  <text x="8" y="414" font-size="12" class="dim"><tspan class="m">send.</tspan> 서브도메인을 쓰기 때문에 루트 도메인의 기존 MX(예: Google Workspace 수신)와 충돌하지 않는다 — MX 레코드는 연결된 서브도메인에만 영향을 준다.</text>
</svg>
