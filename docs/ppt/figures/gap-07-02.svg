<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="알림 수가 늘수록 대응률이 떨어지는 곡선">
  <rect width="960" height="300" fill="#ffffff"/>
  <line x1="90" y1="50" x2="90" y2="226" stroke="#585f6b" stroke-width="1.2"/>
  <line x1="90" y1="226" x2="880" y2="226" stroke="#585f6b" stroke-width="1.2"/>
  <polyline points="90,60 150,66 230,84 330,118 430,158 550,186 690,204 830,212 876,214" fill="none" stroke="#8f4408" stroke-width="2.2"/>
  <text x="96" y="44" font-family="ui-monospace,monospace" font-size="13" fill="#585f6b" text-anchor="start" font-weight="400">대응률</text>
  <text x="880" y="248" font-family="ui-monospace,monospace" font-size="13" fill="#585f6b" text-anchor="end" font-weight="400">하루 알림 수</text>
  <text x="100" y="248" font-family="ui-monospace,monospace" font-size="13" fill="#585f6b" text-anchor="start" font-weight="400">몇 건</text>
  <line x1="430" y1="50" x2="430" y2="226" stroke="#585f6b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="440" y="70" font-family="ui-monospace,monospace" font-size="14" fill="#8f4408" text-anchor="start" font-weight="400">여기서부터 무시하기 시작한다</text>
  <text x="440" y="92" font-family="ui-monospace,monospace" font-size="14" fill="#8f4408" text-anchor="start" font-weight="400">진짜 알림까지 같이</text>
  <text x="24" y="276" font-family="sans-serif" font-size="15" fill="#15181d" text-anchor="start" font-weight="400">울리는데 아무도 안 보는 알림은 없는 것보다 나쁘다.</text>
</svg>
