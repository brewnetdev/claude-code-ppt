<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="스크레이프 간격, 보존 기간, 디스크 용량 세 꼭짓점의 삼각형">
  <rect width="960" height="320" fill="#ffffff"/>
  <polygon points="480,60 250,250 710,250" fill="none" stroke="#585f6b" stroke-width="1.8"/>
  <text x="480" y="46" font-family="ui-monospace,monospace" font-size="16" fill="#15181d" text-anchor="middle" font-weight="600">스크레이프 간격</text>
  <text x="480" y="24" font-family="ui-monospace,monospace" font-size="14" fill="#1a4fa0" text-anchor="middle" font-weight="400">15s ~ 60s</text>
  <text x="240" y="276" font-family="ui-monospace,monospace" font-size="16" fill="#15181d" text-anchor="end" font-weight="600">보존 기간</text>
  <text x="240" y="298" font-family="ui-monospace,monospace" font-size="14" fill="#1a4fa0" text-anchor="end" font-weight="400">3d ~ 30d</text>
  <text x="720" y="276" font-family="ui-monospace,monospace" font-size="16" fill="#15181d" text-anchor="start" font-weight="600">디스크</text>
  <text x="720" y="298" font-family="ui-monospace,monospace" font-size="14" fill="#1a4fa0" text-anchor="start" font-weight="400">10Gi ~ 200Gi</text>
  <rect x="360" y="140" width="240" height="62" rx="0" fill="#f5f6f7" stroke="#1a4fa0" stroke-width="1.5"/>
  <text x="480" y="168" font-family="ui-monospace,monospace" font-size="15" fill="#15181d" text-anchor="middle" font-weight="400">둘을 정하면</text>
  <text x="480" y="190" font-family="ui-monospace,monospace" font-size="15" fill="#1a4fa0" text-anchor="middle" font-weight="400">나머지 하나가 결정된다</text>
</svg>
