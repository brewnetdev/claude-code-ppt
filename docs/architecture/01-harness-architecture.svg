<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t1">코딩 에이전트의 하네스 구조 이해하기 ① 전체 구성도</title>
  <style>
    .sans { font-family: "IBM Plex Sans KR", "IBM Plex Sans", "Pretendard", "Noto Sans CJK KR", sans-serif; }
    .mono { font-family: "JetBrains Mono", "D2Coding", Consolas, "Noto Sans CJK KR", monospace; }
    .ink { fill: #1a1a1a; } .soft { fill: #555555; } .acc { fill: #0f4c81; } .inv { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.5; }
    .box-soft { fill: #f7f7f7; stroke: #d9d9d9; stroke-width: 1; }
    .box-acc { fill: #0f4c81; stroke: #0f4c81; stroke-width: 1; }
    .box-ext { fill: #ffffff; stroke: #555555; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .ln { stroke: #1a1a1a; stroke-width: 2; fill: none; }
    .ln-acc { stroke: #0f4c81; stroke-width: 2; fill: none; }
    .ln-dash { stroke: #555555; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .sep { stroke: #d9d9d9; stroke-width: 1; }
    .lbl { font-size: 20px; font-weight: 600; }
    .lbl-s { font-size: 17px; font-weight: 600; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
    <marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f4c81"/></marker>
    <marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="40" y="46" class="sans ink" font-size="26" font-weight="700" letter-spacing="-0.3">① 전체 구성도 — 코딩 에이전트 = 모델 + 하네스</text>
  <text x="1240" y="46" text-anchor="end" class="mono soft" font-size="12">코딩 에이전트의 하네스 구조 이해하기 · 1/2</text>
  <line x1="40" y1="70" x2="1240" y2="70" class="sep"/>

  <!-- 좌측 외부 -->
  <rect x="40" y="135" width="160" height="52" class="box"/>
  <text x="120" y="168" text-anchor="middle" class="sans ink lbl-s">사용자 / CI</text>
  <path d="M200,161 L228,161" class="ln" marker-end="url(#ah)"/>

  <rect x="40" y="215" width="160" height="90" class="box-ext"/>
  <text x="120" y="267" text-anchor="middle" class="sans ink lbl-s">LLM 모델</text>
  <path d="M200,260 L222,260 L222,201 L510,201 L510,213" class="ln-dash" marker-end="url(#ah-soft)"/>

  <!-- 하네스 -->
  <rect x="232" y="110" width="798" height="530" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="248" y="98" class="mono acc" font-size="14" font-weight="700" letter-spacing="1.5">HARNESS</text>

  <rect x="250" y="135" width="762" height="52" class="box-soft"/>
  <text x="631" y="168" text-anchor="middle" class="sans ink lbl-s">① 인터페이스 계층</text>

  <path d="M600,213 L600,189" class="ln" marker-end="url(#ah)"/>
  <text x="610" y="206" class="sans soft" font-size="13" font-weight="500">최종 응답</text>

  <!-- Row A -->
  <rect x="250" y="215" width="170" height="90" class="box"/>
  <text x="335" y="268" text-anchor="middle" class="sans ink lbl">③ 컨텍스트 조립</text>
  <path d="M420,260 L444,260" class="ln" marker-end="url(#ah)"/>

  <rect x="446" y="215" width="170" height="90" class="box-acc"/>
  <text x="531" y="268" text-anchor="middle" class="sans inv lbl">④ 제너레이터</text>
  <path d="M616,260 L640,260" class="ln" marker-end="url(#ah)"/>

  <rect x="642" y="215" width="170" height="90" class="box"/>
  <text x="727" y="255" text-anchor="middle" class="sans ink lbl">⑤ 훅</text>
  <text x="727" y="282" text-anchor="middle" class="sans soft" font-size="15" font-weight="500">PreToolUse</text>
  <path d="M812,260 L836,260" class="ln" marker-end="url(#ah)"/>

  <rect x="838" y="215" width="170" height="90" class="box"/>
  <text x="923" y="268" text-anchor="middle" class="sans ink lbl">⑥ 권한 게이트</text>

  <path d="M923,305 L923,348" class="ln" marker-end="url(#ah)"/>

  <!-- Row B -->
  <rect x="838" y="350" width="170" height="90" class="box"/>
  <text x="923" y="403" text-anchor="middle" class="sans ink lbl">⑦ 툴 실행</text>
  <path d="M838,395 L814,395" class="ln" marker-end="url(#ah)"/>

  <rect x="642" y="350" width="170" height="90" class="box"/>
  <text x="727" y="390" text-anchor="middle" class="sans ink lbl">⑤ 훅</text>
  <text x="727" y="417" text-anchor="middle" class="sans soft" font-size="15" font-weight="500">PostToolUse</text>
  <path d="M642,395 L618,395" class="ln" marker-end="url(#ah)"/>

  <rect x="446" y="350" width="170" height="90" class="box-acc"/>
  <text x="531" y="403" text-anchor="middle" class="sans inv lbl">⑧ 이벨류에이터</text>
  <path d="M446,395 L422,395" class="ln" marker-end="url(#ah)"/>

  <rect x="250" y="350" width="170" height="90" class="box"/>
  <text x="335" y="403" text-anchor="middle" class="sans ink lbl">관찰 기록</text>

  <path d="M335,350 L335,307" class="ln-acc" marker-end="url(#ah-acc)"/>
  <text x="345" y="333" class="sans acc" font-size="13" font-weight="600">다음 턴</text>

  <!-- ② 루프 가드 -->
  <rect x="250" y="470" width="758" height="48" class="box-soft"/>
  <text x="629" y="501" text-anchor="middle" class="sans ink lbl-s">② 루프 가드</text>

  <!-- ⑨ ⑩ -->
  <rect x="250" y="548" width="372" height="64" class="box-soft"/>
  <text x="436" y="587" text-anchor="middle" class="sans ink lbl-s">⑨ 확장 계층</text>
  <rect x="636" y="548" width="372" height="64" class="box-soft"/>
  <text x="822" y="587" text-anchor="middle" class="sans ink lbl-s">⑩ 세션 · 상태 · 관측성</text>

  <!-- 우측 외부 -->
  <path d="M1008,395 L1058,395" class="ln" marker-end="url(#ah)"/>
  <rect x="1060" y="350" width="180" height="90" class="box-ext"/>
  <text x="1150" y="402" text-anchor="middle" class="sans ink lbl-s">실행 환경</text>

  <rect x="1060" y="135" width="180" height="90" class="box-ext"/>
  <text x="1150" y="176" text-anchor="middle" class="sans ink lbl-s">⑪ 평가 하네스</text>
  <text x="1150" y="200" text-anchor="middle" class="sans soft" font-size="14" font-weight="500">런타임 외부</text>
  <path d="M1060,180 L1032,180" class="ln-dash" marker-end="url(#ah-soft)"/>

  <!-- 범례 -->
  <line x1="40" y1="666" x2="1240" y2="666" class="sep"/>
  <path d="M40,690 L70,690" class="ln"/>
  <text x="78" y="694" class="sans soft" font-size="13">매 턴 경로</text>
  <path d="M170,690 L200,690" class="ln-dash"/>
  <text x="208" y="694" class="sans soft" font-size="13">하네스 경계 밖 호출</text>
  <rect x="340" y="682" width="30" height="16" class="box-acc"/>
  <text x="378" y="694" class="sans soft" font-size="13">생성(④)과 판정(⑧) — 하네스가 결정론을 만드는 두 축</text>
</svg>
