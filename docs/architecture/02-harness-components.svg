<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t2" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t2">코딩 에이전트의 하네스 구조 이해하기 ② 구성별 기능 설명</title>
  <style>
    .sans { font-family: "IBM Plex Sans KR", "IBM Plex Sans", "Pretendard", "Noto Sans CJK KR", sans-serif; }
    .mono { font-family: "JetBrains Mono", "D2Coding", Consolas, "Noto Sans CJK KR", monospace; }
    .ink { fill: #1a1a1a; } .soft { fill: #555555; } .acc { fill: #0f4c81; }
    .sep { stroke: #d9d9d9; stroke-width: 1; }
    .rule { stroke: #1a1a1a; stroke-width: 1; }
    .head { fill: #f7f7f7; }
    .card { fill: #f7f7f7; stroke: #d9d9d9; stroke-width: 1; }
    .card-ext { fill: #ffffff; stroke: #555555; stroke-width: 1; stroke-dasharray: 4 3; }
    .name { font-size: 13.5px; font-weight: 600; }
    .en { font-size: 10.5px; }
    .body { font-size: 12px; }
    .code { font-size: 11.5px; }
  </style>
  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="40" y="46" class="sans ink" font-size="26" font-weight="700" letter-spacing="-0.3">② 구성별 기능 설명 — 루프 경로 순서로 읽는다</text>
  <text x="1240" y="46" text-anchor="end" class="mono soft" font-size="12">코딩 에이전트의 하네스 구조 이해하기 · 2/2</text>
  <line x1="40" y1="70" x2="1240" y2="70" class="sep"/>

  <!-- 섹션 A: 루프 경로 -->
  <text x="40" y="94" class="sans acc" font-size="12" font-weight="700" letter-spacing="1">A. 루프 경로 — 매 턴 지나는 상자 (①→③→④→⑤→⑥→⑦→⑤→⑧→관찰)</text>
  <rect x="40" y="102" width="1200" height="26" class="head"/>
  <line x1="40" y1="128" x2="1240" y2="128" class="rule"/>
  <text x="52" y="120" class="sans ink" font-size="12" font-weight="600">구성요소</text>
  <text x="248" y="120" class="sans ink" font-size="12" font-weight="600">역할</text>
  <text x="490" y="120" class="sans ink" font-size="12" font-weight="600">핵심 기능</text>
  <text x="930" y="120" class="sans ink" font-size="12" font-weight="600">구현 예 — Claude Code · Codex CLI</text>

  <!-- 행 y = 128 + 46n -->
  <text x="52" y="147" class="sans ink name">① 인터페이스 계층</text>
  <text x="52" y="162" class="sans soft en">Interface Layer</text>
  <text x="248" y="147" class="sans ink body">사용자·CI와 하네스가 만나는 면</text>
  <text x="248" y="164" class="sans ink body">대화형과 헤드리스는 같은 코어의 두 출력</text>
  <text x="490" y="147" class="sans ink body">스트리밍 렌더링 · 실행 중 인터럽트 · 승인 프롬프트</text>
  <text x="490" y="164" class="sans ink body">CI용 JSON 이벤트 스트림 · 최종 응답 반환</text>
  <text x="930" y="147" class="mono ink code">claude -p --output-format stream-json</text>
  <text x="930" y="164" class="mono ink code">codex exec</text>
  <line x1="40" y1="174" x2="1240" y2="174" class="sep"/>

  <text x="52" y="193" class="sans ink name">③ 컨텍스트 조립</text>
  <text x="52" y="208" class="sans soft en">Context Assembly</text>
  <text x="248" y="193" class="sans ink body">이번 턴에 모델이 볼 것을 고른다</text>
  <text x="248" y="210" class="sans ink body">유한한 창 안의 정보 선별</text>
  <text x="490" y="193" class="sans ink body">시스템 프롬프트 + 지침 파일 + 히스토리의 계층 조립</text>
  <text x="490" y="210" class="sans ink body">컴팩션 · 툴 출력 절단 · 토큰 회계</text>
  <text x="930" y="193" class="mono ink code">CLAUDE.md (글로벌→프로젝트→로컬)</text>
  <text x="930" y="210" class="mono ink code">AGENTS.md · /compact</text>
  <line x1="40" y1="220" x2="1240" y2="220" class="sep"/>

  <text x="52" y="239" class="sans acc name">④ 제너레이터</text>
  <text x="52" y="254" class="sans soft en">Generator</text>
  <text x="248" y="239" class="sans ink body">모델을 호출해 다음 행동을 생성</text>
  <text x="248" y="256" class="sans ink body">하네스에서 유일한 모델 교체 지점</text>
  <text x="490" y="239" class="sans ink body">LLM 호출 · 스트리밍 파싱 · 툴콜 스키마 강제</text>
  <text x="490" y="256" class="sans ink body">재시도/백오프 · 툴콜 없으면 최종 응답으로 분기</text>
  <text x="930" y="239" class="mono ink code">Claude API · Responses API</text>
  <text x="930" y="256" class="mono ink code">로컬 vLLM (OpenAI 호환 엔드포인트)</text>
  <line x1="40" y1="266" x2="1240" y2="266" class="sep"/>

  <text x="52" y="285" class="sans ink name">⑤ 훅 PreToolUse</text>
  <text x="52" y="300" class="sans soft en">Hook · 툴 실행 전</text>
  <text x="248" y="285" class="sans ink body">툴이 실행되기 전에 끼어든다</text>
  <text x="248" y="302" class="sans ink body">규칙을 지시(프롬프트)에서 구조(스크립트)로</text>
  <text x="490" y="285" class="sans ink body">외부 스크립트 실행 · 파괴 명령 패턴 검사</text>
  <text x="490" y="302" class="sans ink body">exit 2로 차단 · 모델에 사유 반환</text>
  <text x="930" y="285" class="mono ink code">settings.json hooks.PreToolUse</text>
  <text x="930" y="302" class="mono ink code">matcher: Bash · Write · Edit</text>
  <line x1="40" y1="312" x2="1240" y2="312" class="sep"/>

  <text x="52" y="331" class="sans ink name">⑥ 권한 게이트</text>
  <text x="52" y="346" class="sans soft en">Permission Gate · Sandbox</text>
  <text x="248" y="331" class="sans ink body">자율성과 파괴 가능성의 균형점</text>
  <text x="248" y="348" class="sans ink body">사용자 머신에서 돌므로 SDK보다 엄격</text>
  <text x="490" y="331" class="sans ink body">행동 분류(읽기/쓰기/파괴/네트워크) · allow/deny · 승인 모드</text>
  <text x="490" y="348" class="sans ink body">OS 수준 샌드박스 · 프롬프트 인젝션 방어</text>
  <text x="930" y="331" class="mono ink code">default · acceptEdits · plan</text>
  <text x="930" y="348" class="mono ink code">seatbelt · landlock · --ask-for-approval</text>
  <line x1="40" y1="358" x2="1240" y2="358" class="sep"/>

  <text x="52" y="377" class="sans ink name">⑦ 툴 실행</text>
  <text x="52" y="392" class="sans soft en">Tool Dispatch · ACI</text>
  <text x="248" y="377" class="sans ink body">모델의 의도를 실제 행동으로 바꾼다</text>
  <text x="248" y="394" class="sans ink body">툴 개수보다 에러 메시지 품질이 성능을 좌우</text>
  <text x="490" y="377" class="sans ink body">JSON Schema 계약 → 디스패치 → 결과 직렬화</text>
  <text x="490" y="394" class="sans ink body">타임아웃 · 대용량 출력 절단 · 실행 환경 어댑터(FS·셸·Git)</text>
  <text x="930" y="377" class="mono ink code">Read · Edit · Bash · Grep · Glob · Task · MCP</text>
  <text x="930" y="394" class="mono ink code">shell · apply_patch (Codex)</text>
  <line x1="40" y1="404" x2="1240" y2="404" class="sep"/>

  <text x="52" y="423" class="sans ink name">⑤ 훅 PostToolUse</text>
  <text x="52" y="438" class="sans soft en">Hook · 툴 실행 후</text>
  <text x="248" y="423" class="sans ink body">툴 결과가 모델에 돌아가기 전에 끼어든다</text>
  <text x="248" y="440" class="sans ink body">자동 정리와 검사의 지점</text>
  <text x="490" y="423" class="sans ink body">포맷터 · 린터 · 슬롭 검사 자동 실행</text>
  <text x="490" y="440" class="sans ink body">결과에 컨텍스트 주입 · 위반 시 모델에 피드백</text>
  <text x="930" y="423" class="mono ink code">settings.json hooks.PostToolUse</text>
  <text x="930" y="440" class="mono ink code">Stop · SubagentStop 훅으로 종료 조건 검사</text>
  <line x1="40" y1="450" x2="1240" y2="450" class="sep"/>

  <text x="52" y="469" class="sans acc name">⑧ 이벨류에이터</text>
  <text x="52" y="484" class="sans soft en">Evaluator</text>
  <text x="248" y="469" class="sans ink body">생성 결과가 맞는지 판정한다</text>
  <text x="248" y="486" class="sans ink body">내장 컴포넌트가 아니라 하네스가 조립</text>
  <text x="490" y="469" class="sans ink body">빌드·테스트·린트·타입체크 결과를 관찰로 환류</text>
  <text x="490" y="486" class="sans ink body">구현자와 분리된 평가자 · 실패 사례는 골든셋으로 승격</text>
  <text x="930" y="469" class="mono ink code">PostToolUse 훅 + 테스트 툴</text>
  <text x="930" y="486" class="mono ink code">+ squad-evaluator 서브에이전트</text>
  <line x1="40" y1="496" x2="1240" y2="496" class="sep"/>

  <text x="52" y="515" class="sans ink name">관찰 기록</text>
  <text x="52" y="530" class="sans soft en">Observation</text>
  <text x="248" y="515" class="sans ink body">이번 턴의 결과를 다음 턴의 입력으로</text>
  <text x="490" y="515" class="sans ink body">툴 결과·판정·에러를 히스토리에 추가 → ③으로 복귀</text>
  <text x="930" y="515" class="mono ink code">tool_result 메시지 · 세션 트랜스크립트</text>
  <line x1="40" y1="540" x2="1240" y2="540" class="rule"/>

  <!-- 섹션 B: 횡단 계층 -->
  <text x="40" y="562" class="sans acc" font-size="12" font-weight="700" letter-spacing="1">B. 횡단 계층 — 루프 전체를 감싼다</text>
  <rect x="40" y="570" width="392" height="56" class="card"/>
  <text x="52" y="590" class="sans ink name">② 루프 가드</text>
  <text x="52" y="607" class="sans ink body">최대 턴 · 토큰 예산 · 동일 툴콜 반복 감지 · 컴팩션 트리거</text>
  <text x="52" y="621" class="sans soft body">모델 판단과 별개로 종료를 강제 (--max-turns)</text>

  <rect x="444" y="570" width="392" height="56" class="card"/>
  <text x="456" y="590" class="sans ink name">⑨ 확장 계층</text>
  <text x="456" y="607" class="sans ink body">MCP 서버 · 스킬/커맨드 · 서브에이전트 · 플러그인</text>
  <text x="456" y="621" class="sans soft body">루프에 새 툴·역할·절차를 꽂는 지점</text>

  <rect x="848" y="570" width="392" height="56" class="card"/>
  <text x="860" y="590" class="sans ink name">⑩ 세션 · 상태 · 관측성</text>
  <text x="860" y="607" class="sans ink body">resume · 체크포인트/롤백 · 툴콜 트레이스 · 토큰 회계 · 감사 로그</text>
  <text x="860" y="621" class="sans soft body">모든 턴을 기록하고 되돌리는 지점</text>

  <!-- 섹션 C: 경계 밖 -->
  <text x="40" y="652" class="sans acc" font-size="12" font-weight="700" letter-spacing="1">C. 하네스 경계 밖 (점선 상자)</text>
  <rect x="40" y="660" width="392" height="44" class="card-ext"/>
  <text x="52" y="678" class="sans ink name">LLM 모델</text>
  <text x="52" y="695" class="sans ink body">④가 호출하는 대상 · Claude API · Responses API · 로컬 vLLM</text>

  <rect x="444" y="660" width="392" height="44" class="card-ext"/>
  <text x="456" y="678" class="sans ink name">실행 환경</text>
  <text x="456" y="695" class="sans ink body">⑦이 닿는 대상 · 파일시스템 · 셸 · Git · 네트워크 (샌드박스 안)</text>

  <rect x="848" y="660" width="392" height="44" class="card-ext"/>
  <text x="860" y="678" class="sans ink name">⑪ 평가 하네스</text>
  <text x="860" y="695" class="sans ink body">런타임 밖에서 하네스 자체를 회귀 검증 · 골든셋 · run_eval.py</text>
</svg>
