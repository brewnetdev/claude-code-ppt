<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{DECK_TITLE}}</title>
<style>
/* ============================================================
   html-ppt-pro :: 16:9 standalone deck skeleton
   Theme = :root token block only. See references/THEMES.md.
   Default theme: navy-clinical (bg #F4F6F9 / navy #0A2540 / blue #1890FF)
   Fonts: Pretendard(한국어 기업·의료 문서의 중립적 신뢰 톤) +
          JetBrains Mono(수치·라벨의 tabular 정렬)
   ============================================================ */
:root {
  --bg: #F4F6F9;            /* stage background */
  --surface: #FFFFFF;       /* card panel */
  --navy: #0A2540;          /* main — cover, callout band, headings */
  --blue: #1890FF;          /* point — KPI values, badges, emphasis */
  --text-1: #1E293B;        /* body */
  --text-2: #475569;        /* secondary */
  --text-3: #8A94A6;        /* caption / footer */
  --border: #D7DEE8;
  --border-strong: #B6C2D2;
  --good: #0E9F6E; --warn: #D97706; --bad: #DC2626;
  --radius: 8px; --radius-sm: 4px;
  --shadow: 0 1px 2px rgba(0,0,0,.06);   /* 이 한 단계만 허용 */
  --font-sans: 'Pretendard', 'Noto Sans KR', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #E8ECF2; }
body {
  font-family: var(--font-sans); color: var(--text-1);
  word-break: keep-all; overflow-wrap: break-word;  /* 단어 중간 줄바꿈 금지 */
  overflow: hidden;
}

/* ---- 16:9 stage: 화면 중앙 고정비율 확대·축소 ---- */
#viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#deck { position: relative; width: 1280px; height: 720px; transform-origin: center center; background: var(--bg); }
.slide { position: absolute; inset: 0; display: none; flex-direction: column; padding: 56px 72px 48px; overflow: hidden; background: var(--bg); }
.slide.is-active { display: flex; }

/* ---- chrome ---- */
.slide-footer { position: absolute; left: 72px; right: 72px; bottom: 22px;
  display: flex; justify-content: space-between; font: 500 11px var(--font-mono);
  letter-spacing: .08em; color: var(--text-3); }
.page-num::after { content: attr(data-n) " / " attr(data-total); }

/* ---- typography ---- */
.kicker { font: 700 13px var(--font-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--blue); margin-bottom: 10px; }
.title { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; color: var(--navy); margin-bottom: 12px; }
.subtitle { font-size: 19px; line-height: 1.55; color: var(--text-2); margin-bottom: 28px; max-width: 62ch; }
.slide-body { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
/* justify-content:center — 콘텐츠가 적어도 하단 여백이 과해지지 않게 수직 중앙 배치 */

/* ---- layout primitives ---- */
.grid { display: grid; gap: 20px; }
.g2 { grid-template-columns: repeat(2, 1fr); }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g4 { grid-template-columns: repeat(4, 1fr); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 22px 24px; box-shadow: var(--shadow); }
.card.is-key { border: 1px solid var(--blue); }   /* 강조 카드: 액센트 바 대신 전체 보더 */
.card h3 { font-size: 18px; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
.card p { font-size: 15px; line-height: 1.6; color: var(--text-2); }
.badge { display: inline-block; padding: 3px 10px; border-radius: var(--radius-sm);
  font: 700 12px var(--font-mono); background: var(--blue); color: #fff; }
.badge.ghost { background: transparent; color: var(--blue); border: 1px solid var(--blue); }

/* ---- callout band (하단 강조 바 — 딥 네이비) ---- */
.callout-band { background: var(--navy); color: #fff; border-radius: var(--radius);
  padding: 18px 26px; font-size: 16px; line-height: 1.55; margin-top: 24px; }
.callout-band strong { color: #6FBBFF; font-weight: 700; }

/* ---- KPI / stat ---- */
.kpi { text-align: left; }
.kpi .v { font: 800 46px/1.1 var(--font-sans); color: var(--blue); letter-spacing: -.02em; }
.kpi .v.navy { color: var(--navy); }
.kpi .k { font-size: 14px; color: var(--text-2); margin-top: 6px; }

/* ---- bar chart (CSS flat bars) ---- */
.bars { display: flex; align-items: flex-end; gap: 32px; height: 240px; padding: 0 8px; }
.bars .bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; text-align: center; height: 100%; }
.bars .bar i { display: block; background: var(--navy); border-radius: 3px 3px 0 0; font-style: normal; }
.bars .bar.is-key i { background: var(--blue); }
.bars .bar b { font: 700 17px var(--font-mono); color: var(--navy); margin-bottom: 6px; }
.bars .bar.is-key b { color: var(--blue); }
.bars .bar span { font-size: 13px; color: var(--text-2); margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }

/* ---- donut / gauge (SVG pathLength=100 — 값을 dasharray 첫 항에) ---- */
.donut, .gauge { display: flex; align-items: center; gap: 18px; }
.donut svg, .gauge svg { flex-shrink: 0; }
.donut .track { stroke: var(--border); }
.donut .val { stroke: var(--blue); }
.donut .val.navy { stroke: var(--navy); }
.donut .num, .gauge .num { font: 800 26px var(--font-sans); fill: var(--navy); }
.chart-caption { font-size: 14px; line-height: 1.5; color: var(--text-2); }

/* ---- comparison (A vs B 강조) ---- */
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: stretch; }
.vs .side { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; text-align: center; }
.vs .side.win { border: 1px solid var(--blue); }
.vs .side .who { font-size: 15px; font-weight: 700; color: var(--text-2); }
.vs .side .num { font: 800 56px/1.2 var(--font-sans); }
.vs .side.win .num { color: var(--blue); }
.vs .side:not(.win) .num { color: var(--navy); }
.vs .mid { align-self: center; font: 700 15px var(--font-mono); color: var(--text-3); }

/* ---- phase roadmap (Phase 1→3) ---- */
.phases { display: grid; grid-template-columns: 1fr 28px 1fr 28px 1fr; gap: 0; align-items: stretch; }
.phase { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; }
.phase .tag { font: 700 12px var(--font-mono); color: var(--blue); letter-spacing: .1em; }
.phase h4 { font-size: 17px; color: var(--navy); margin: 8px 0 10px; }
.phase ul { list-style: none; }
.phase li { font-size: 13.5px; color: var(--text-2); line-height: 1.55; padding-left: 14px; position: relative; }
.phase li::before { content: ''; position: absolute; left: 0; top: .55em; width: 6px; height: 2px; background: var(--blue); }
.phase-arrow { align-self: center; text-align: center; color: var(--border-strong); font-size: 18px; }

/* ---- table ---- */
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
th { background: var(--navy); color: #fff; font-size: 14px; font-weight: 700; padding: 12px 16px; text-align: left; }
td { font-size: 14px; padding: 11px 16px; border-top: 1px solid var(--border); color: var(--text-1); }
td.num { font-family: var(--font-mono); text-align: right; }

/* ---- cover (딥 네이비 + 정적 기하 그래픽) ---- */
.slide.cover { background: var(--navy); color: #fff; justify-content: center; }
.slide.cover .kicker { color: #6FBBFF; }
.slide.cover .title { color: #fff; font-size: 52px; max-width: 20ch; }
.slide.cover .subtitle { color: #B9C6D6; }
.slide.cover .meta { font: 500 13px var(--font-mono); color: #7E93AB; margin-top: 40px; }
.cover-art { position: absolute; right: 48px; top: 80px; opacity: .55; pointer-events: none; }
/* 블리드(-60px 등 캔버스 밖 배치) 금지 — verify.mjs가 자식 박스 기준으로 잡는다 */
.slide.cover .slide-footer { color: #7E93AB; }

/* ---- section divider ---- */
.slide.section { background: var(--navy); color: #fff; justify-content: center; }
.slide.section .sec-num { font: 800 72px var(--font-mono); color: #6FBBFF; }
.slide.section .title { color: #fff; }
.slide.section .subtitle { color: #B9C6D6; }

/* ---- print = PDF ---- */
@page { size: 1280px 720px; margin: 0; }
@media print {
  html, body { background: #fff; overflow: visible; }
  #viewport { position: static; display: block; }
  #deck { transform: none !important; width: 1280px; height: auto; }
  .slide { display: flex; position: relative; width: 1280px; height: 720px; page-break-after: always; }
}
</style>
</head>
<body>
<div id="viewport">
<div id="deck">

<!-- ═══ 1. COVER — 표지: 네이비 배경 + 정적 기하 아트 ═══ -->
<section class="slide cover">
  <svg class="cover-art" width="560" height="560" viewBox="0 0 560 560" fill="none" aria-hidden="true">
    <circle cx="280" cy="280" r="120" stroke="#2E4A68" stroke-width="1.5"/>
    <circle cx="280" cy="280" r="190" stroke="#2E4A68" stroke-width="1"/>
    <circle cx="280" cy="280" r="260" stroke="#22394F" stroke-width="1"/>
    <circle cx="280" cy="160" r="5" fill="#1890FF"/>
    <circle cx="420" cy="350" r="4" fill="#6FBBFF"/>
    <circle cx="150" cy="330" r="3.5" fill="#2E4A68"/>
    <line x1="280" y1="160" x2="420" y2="350" stroke="#2E4A68" stroke-width="1"/>
    <line x1="280" y1="160" x2="150" y2="330" stroke="#22394F" stroke-width="1"/>
  </svg>
  <p class="kicker">{{ORG_OR_EVENT}}</p>
  <h1 class="title">{{DECK_TITLE}}</h1>
  <p class="subtitle">{{DECK_SUBTITLE}}</p>
  <p class="meta">{{DATE}} · {{AUTHOR}}</p>
  <footer class="slide-footer"><span>{{FOOTER_LEFT}}</span><span class="page-num" data-n="1"></span></footer>
</section>

<!-- ═══ 2. BODY — 모듈형 카드 패널 예시 ═══ -->
<section class="slide">
  <p class="kicker">01 · {{CHAPTER}}</p>
  <h2 class="title">{{SLIDE_TITLE}}</h2>
  <p class="subtitle">{{ONE_LINE_MESSAGE}}</p>
  <div class="slide-body">
    <div class="grid g3">
      <div class="card"><h3>{{CARD_T1}}</h3><p>{{CARD_B1}}</p></div>
      <div class="card is-key"><h3>{{CARD_T2}}</h3><p>{{CARD_B2}}</p></div>
      <div class="card"><h3>{{CARD_T3}}</h3><p>{{CARD_B3}}</p></div>
    </div>
    <div class="callout-band">{{CALLOUT — 주장 + 근거 수치. <strong>강조부</strong>는 strong.}}</div>
  </div>
  <footer class="slide-footer"><span>{{FOOTER_LEFT}}</span><span class="page-num" data-n="2"></span></footer>
</section>

</div>
</div>
<script>
(function () {
  var deck = document.getElementById('deck');
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var idx = Math.max(0, Math.min(slides.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
  slides.forEach(function (s, i) {
    var pn = s.querySelector('.page-num');
    if (pn) { pn.dataset.n = i + 1; pn.dataset.total = slides.length; }
  });
  function show(n) {
    idx = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach(function (s, i) { s.classList.toggle('is-active', i === idx); });
    history.replaceState(null, '', '#' + (idx + 1));
  }
  function fit() {
    deck.style.transform = 'scale(' + Math.min(innerWidth / 1280, innerHeight / 720) + ')';
  }
  addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') show(idx + 1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') show(idx - 1);
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(slides.length - 1);
  });
  addEventListener('resize', fit);
  show(idx); fit();
})();
</script>
</body>
</html>
